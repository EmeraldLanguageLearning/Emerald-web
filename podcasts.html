<head><script src="legacy.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Emerald"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#49B190"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    /* Emerald Language Learning palette */
    --emerald:#49B190; --emerald-link:#53AC90; --emerald-dark:#457865; --emerald-soft:#72B1A0; --emerald-hover:#3f9c7e;
    --text-strong:#323232; --text:#777777; --bg:#FFFFFF; --bg-soft:#F9F9F9; --line:#DADADA; --line-strong:#BBBBBB;
    --accent-soft:#e9f6f1;
    --font-head:"Montserrat","Segoe UI",system-ui,sans-serif; --font-body:"Open Sans","Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  img{max-width:100%}
  .desc,.info,#shArtist,.card b,.card span,#status{overflow-wrap:anywhere;word-break:break-word}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:40px}
  [hidden]{display:none!important}
  .wrap{max-width:1080px;width:80%;margin:0 auto}
  @media (max-width:720px){.wrap{width:auto;padding-left:16px;padding-right:16px}}
  button{font:inherit;cursor:pointer;color:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--emerald-dark);outline-offset:2px}

  /* site header */
  .site{background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .site-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
  .brand-logo{height:60px;width:auto;display:block}
.brand-home{display:block;line-height:0;border-radius:6px;cursor:pointer;transition:opacity .15s}.brand-home:hover{opacity:.85}.brand-home:focus-visible{outline:3px solid #49B190;outline-offset:3px}
  @media (max-width:520px){.brand-logo{height:44px}.site-in{padding-block:12px}}
  .lang{display:inline-flex;border:1px solid var(--emerald);border-radius:4px;overflow:hidden;flex:none}
  .lang button{font:600 .85rem var(--font-body);letter-spacing:.04em;border:0;background:#fff;color:var(--emerald-dark);padding:7px 13px}
  .lang button+button{border-left:1px solid var(--emerald)}
  .lang button:hover{background:var(--accent-soft)}
  .lang button[aria-pressed="true"]{background:var(--emerald);color:#fff}

  /* player – sticks to the top */
  #player{position:-webkit-sticky;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(69,120,101,.08)}
  .p-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:10px}
  #player.idle .pCtrls, #player.idle .seek, #player.idle .pLinks{opacity:.4;pointer-events:none}
  #pArt{width:56px;height:56px;border-radius:4px;object-fit:cover;flex:none;background:var(--accent-soft)}
  .pInfo{flex:1 1 240px;min-width:0}
  #pTitle{font-weight:700;font-size:.92rem;color:var(--text-strong)}
  #pShow{font-size:.8rem;color:var(--text)}
  /* long titles scroll back and forth instead of being cut off */
  .mq{white-space:nowrap;overflow:hidden;max-width:100%}
  .mq-in{display:inline-block;will-change:transform}
  .mq.scrolling .mq-in{animation:mq var(--mq-t,10s) ease-in-out infinite alternate}
  @keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--mq-d,0))}}
  @media (prefers-reduced-motion:reduce){.mq{white-space:normal}.mq.scrolling .mq-in{animation:none}}
  .seek{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}
  .seek input{flex:1;accent-color:var(--emerald)}
  .pCtrls{display:flex;align-items:center;gap:6px;flex:none}
  .pCtrls button{background:none;border:0;color:var(--emerald-dark);padding:6px 8px;border-radius:4px;font-size:.8rem;font-weight:700}
  .pCtrls button:hover{background:var(--accent-soft)}
  .pp{display:flex;align-items:center;gap:6px;padding:9px 14px !important;border:1px solid var(--emerald) !important;background:#fff !important;font-size:.88rem !important}
  .pp svg{width:18px;height:18px;fill:currentColor}
  .pp.active{background:var(--emerald) !important;color:#fff !important}
  #pSpeed{border:1px solid var(--line) !important;min-width:46px}
  .pLinks{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;font-size:.8rem}
  .pLinks a{color:var(--emerald-link);text-decoration:none;font-weight:600}
  .pLinks a:hover{text-decoration:underline}
  .vol{display:flex;align-items:center;gap:6px;margin-left:6px}
  #pMute{padding:4px !important;display:grid;place-items:center}
  #pMute svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #pVol{-webkit-appearance:none;appearance:none;width:110px;height:6px;border-radius:3px;background:linear-gradient(to right,var(--emerald) var(--v,100%),var(--line) var(--v,100%));cursor:pointer}
  #pVol::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--emerald);border:2px solid #fff}
  #pVol::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--emerald);border:2px solid #fff}
  #volVal{font-size:.75rem;color:var(--text);min-width:34px}
  @media (max-width:520px){
    .search .btn{padding:10px 12px}
    .item{gap:10px;padding:10px}
    .item img{width:60px;height:60px}
    .pbtn{width:42px;height:42px}
    #pVol{width:80px}
  }
  @media (max-width:900px){
    .pCtrls{width:100%;justify-content:center;flex-wrap:wrap}
  }
  @media (max-width:640px){
    .p-in{flex-wrap:wrap}
    .pInfo{flex-basis:calc(100% - 70px)}
    .pCtrls{width:100%;justify-content:center;flex-wrap:wrap}
  }

  /* page */
  .title-block{text-align:center;padding:34px 0 18px}
  h1{font-family:var(--font-head);font-weight:400;text-transform:uppercase;color:var(--emerald-dark);font-size:clamp(1.7rem,4.5vw,2.8rem);line-height:1.2;margin:0 0 8px;letter-spacing:.01em}
  .sub{margin:0 auto;color:var(--text);max-width:56ch}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .search{flex:1 1 260px;min-width:0;display:flex;gap:8px}
  .search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:4px;font-size:1rem;background:var(--bg-soft);color:var(--text-strong)}
  .search input:focus{outline:none;border-color:var(--emerald);background:#fff}
  .btn{padding:10px 18px;border:1px solid var(--emerald);border-radius:4px;background:var(--emerald);color:#fff;font-weight:600}
  .btn:hover{background:var(--emerald-hover);border-color:var(--emerald-hover)}
  select{padding:10px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text-strong);font:inherit;font-size:.95rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);font-size:.88rem}
  .chip:hover{border-color:var(--emerald);color:var(--emerald-dark)}
  .chip.active{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:22px 0 12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  @media (max-width:520px){.tabs{gap:16px}.tab{font-size:.92rem}}
  .tab{white-space:nowrap;flex:none;padding:8px 2px;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;color:var(--text)}
  .tab:hover{color:var(--emerald-link)}
  .tab.active{color:var(--emerald-link);border-bottom-color:var(--emerald)}
  #status{color:var(--emerald-dark);font-size:.92rem;min-height:1.4em}
  #back{margin:8px 0 0;background:#fff;color:var(--emerald-dark);border:1px solid var(--emerald);border-radius:4px;padding:7px 12px;font-weight:600}
  #back:hover{background:var(--accent-soft)}
  #showHeader{display:none;flex-wrap:wrap;padding:14px 0 4px;gap:10px 14px;align-items:center}
  #showHeader>div{flex:1 1 160px;min-width:0}
  #showHeader img{width:76px;height:76px;border-radius:4px;object-fit:cover}
  #showHeader h2{margin:0;font-family:var(--font-head);font-weight:700;font-size:1.15rem;color:var(--text-strong)}
  .list{padding:8px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .list>*,.grid>*{min-width:0}
  .item{display:flex;gap:14px;background:var(--bg-soft);border:1px solid transparent;border-radius:4px;padding:12px;align-items:flex-start}
  .item img{width:76px;height:76px;border-radius:4px;object-fit:cover;flex:none;background:var(--accent-soft)}
  .meta{flex:1;min-width:0}
  .title{font-family:var(--font-head);font-weight:700;color:var(--text-strong);margin:0 0 2px;line-height:1.35;font-size:.98rem}
  .show{display:block;max-width:100%;color:var(--emerald-link);font-size:.88rem;font-weight:600;margin:0 0 4px;background:none;border:0;padding:0;text-align:left}
  .show:hover{text-decoration:underline}
  .info{color:var(--text);font-size:.82rem;margin:0 0 4px}
  .desc{font-size:.9rem;color:var(--text);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .desc.open{-webkit-line-clamp:unset}
  .more{background:none;border:0;color:var(--emerald-dark);font-size:.82rem;font-weight:700;padding:4px 0}
  .more:hover{text-decoration:underline}
  .pbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--emerald);display:grid;place-items:center}
  .pbtn:hover{background:var(--emerald-hover)}
  .pbtn svg{width:20px;height:20px;fill:#fff}
  .item.playing{border-color:var(--emerald);box-shadow:inset 3px 0 0 var(--emerald)}
  .grid{padding:8px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:14px}
  @media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
  .card{background:var(--bg-soft);border:0;border-radius:4px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;color:var(--text)}
  .card:hover{box-shadow:0 4px 14px rgba(69,120,101,.12)}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--accent-soft)}
  .card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--font-head);font-size:.9rem;line-height:1.25;color:var(--text-strong)}
  .card span{font-size:.8rem;color:var(--text);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  #follow{margin-left:auto;flex:none;max-width:100%;background:#fff;color:var(--emerald-dark);border:1px solid var(--emerald);border-radius:4px;padding:8px 12px;font-weight:600;font-size:.85rem}
  #follow:hover{background:var(--accent-soft)}
  #follow.on{background:var(--emerald);color:#fff}
  .empty{background:var(--bg-soft);border-radius:4px;padding:22px;text-align:center;color:var(--text)}
</style>
<style id="emerald-dark">
/* Dark version of the Emerald look, used when the phone is in dark mode */
@media screen and (prefers-color-scheme: dark){
  :root{color-scheme:dark;--emerald-dark:#7fcbb0;--emerald-link:#6cc8a6;--text-strong:#edf2f0;--text:#b6c2bd;--bg:#121816;--bg-soft:#1a2320;--line:#2f3b37;--line-strong:#4b5a55;--accent-soft:#1d3a31}
  #player{background:#161e1b;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .pp{background:transparent!important}
  .pp.active{background:#49B190!important;color:#fff!important}
  #pVol::-webkit-slider-thumb{border-color:#161e1b}
  #pVol::-moz-range-thumb{border-color:#161e1b}
  .search input:focus{background:#1f2a26}
  select{background:#1f2a26;color:var(--text-strong)}
  .chip{background:transparent}
  .chip.active{background:#49B190;color:#fff}
  #back,#follow{background:transparent}
  #follow.on{background:#49B190;color:#fff}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.45)}

  .site{background:#161e1b!important;border-bottom-color:#2f3b37!important}
  .brand-logo{background:#fff;border-radius:6px;padding:4px 8px;box-sizing:content-box}
  .lang button{background:transparent!important;color:#7fcbb0!important}
  .lang button[aria-pressed="true"]{background:#49B190!important;color:#fff!important}
  .app-home{background:transparent!important;color:#7fcbb0!important}
  .app-home:hover{background:#1d3a31!important}
}
</style>

</head>
