<title>Aeroscopia Quiz · Emerald Language Learning</title>

<style>
:root{
  --emerald:#49B190; --emerald-link:#53AC90; --emerald-dark:#457865; --emerald-soft:#72B1A0;
  --text-strong:#323232; --text:#777777; --bg:#FFFFFF; --bg-soft:#F9F9F9;
  --line:#DADADA; --line-strong:#BBBBBB; --bad:#C0573E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;color:#777777;color:var(--text);background:#fff;line-height:1.7;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit}
header.top{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:10px 4%;border-bottom:1px solid #DADADA;background:#fff;position:-webkit-sticky;position:sticky;top:0;z-index:5}
header.top img{height:60px;width:auto;display:block}
header.top .score{font-family:'Montserrat',sans-serif;font-weight:700;color:#457865;font-size:15px;text-align:right;line-height:1.3}
header.top .score small{display:block;font-family:'Open Sans',sans-serif;font-weight:400;color:#777;font-size:12px}
.progress{height:4px;background:#F0F0F0}
.progress div{height:4px;background:#49B190;width:0;-webkit-transition:width .3s;transition:width .3s}
main{width:92%;max-width:820px;margin:0 auto;padding:26px 0 60px}
h1{font-family:'Montserrat',sans-serif;font-weight:300;text-transform:uppercase;color:#457865;text-align:center;font-size:40px;line-height:1.25;letter-spacing:1px;margin:24px 0 8px}
h2.section{font-family:'Montserrat',sans-serif;font-weight:400;text-transform:uppercase;color:#457865;text-align:center;font-size:26px;letter-spacing:1px;margin:6px 0 4px}
.kicker{text-align:center;color:#72B1A0;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:13px;margin:0}
.intro{text-align:center;max-width:600px;margin:0 auto 18px;line-height:1.9}
.card{background:#F9F9F9;border-radius:4px;padding:58px 28px 28px;margin:56px 0 20px;position:relative;text-align:center}
.badge{position:absolute;left:50%;top:-44px;margin-left:-44px;width:88px;height:88px;border-radius:50%;background:#49B190;color:#fff;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:28px;border:4px solid #fff}
.badge svg{width:42px;height:42px}
.card h3{font-family:'Montserrat',sans-serif;font-weight:700;color:#323232;font-size:21px;line-height:1.45;margin:0 0 6px}
.card .sub{margin:0 0 14px;font-size:15px}
.answer-row{max-width:520px;margin:14px auto 0}
input.txt{width:100%;padding:13px 14px;border:1px solid #BBBBBB;border-radius:4px;font-size:18px;color:#323232;background:#fff;-webkit-appearance:none;text-align:center}
input.txt:focus{outline:none;border-color:#49B190;box-shadow:0 0 0 3px rgba(73,177,144,.2)}
input.txt[disabled]{background:#F3F3F3;color:#777}
.btn{display:inline-block;background:#49B190;color:#fff;border:1px solid #49B190;border-radius:4px;padding:11px 24px;font-weight:600;font-size:16px;cursor:pointer;margin:6px 4px;-webkit-appearance:none;text-decoration:none}
.btn:hover{background:#3f9c7e;border-color:#3f9c7e}
.btn.outline{background:#fff;color:#457865;border-color:#49B190}
.btn.outline:hover{background:#EEF7F3}
.btn.ghost{background:transparent;border-color:transparent;color:#777;font-weight:400;text-decoration:underline}
.btn[disabled]{opacity:.45;cursor:default}
.opts{max-width:520px;margin:10px auto 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #DADADA;border-radius:4px;padding:12px 16px;margin:0 0 10px;font-size:17px;color:#323232;cursor:pointer;-webkit-appearance:none}
.opt .l{display:inline-block;width:28px;height:28px;line-height:26px;border-radius:50%;border:1px solid #BBBBBB;text-align:center;margin-right:12px;font-size:14px;color:#777;font-weight:600}
.opt.sel{border-color:#49B190;background:#EEF7F3}
.opt.sel .l{background:#49B190;border-color:#49B190;color:#fff}
.opt.right{border-color:#49B190;background:#E3F3EC}
.opt.right .l{background:#49B190;border-color:#49B190;color:#fff}
.opt.wrong{border-color:#C0573E;background:#FBEDE9}
.opt.wrong .l{background:#C0573E;border-color:#C0573E;color:#fff}
.opt[disabled]{cursor:default}
.fb{margin:14px auto 0;max-width:560px;padding:12px 16px;border-radius:4px;font-size:16px;display:none}
.fb.show{display:block}
.fb.ok{background:#E3F3EC;color:#2f6b55}
.fb.no{background:#FBEDE9;color:#9b4430}
.fb.info{background:#fff;border:1px dashed #BBBBBB;color:#777}
.fb b{color:inherit}
.nav{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;margin-top:10px}
.nav .count{font-size:14px;color:#777}
.rebus{background:#fff;border:1px solid #DADADA;border-radius:4px;min-height:190px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin:6px auto 4px;max-width:520px;padding:20px;font-family:'Montserrat',sans-serif;color:#323232}
.photo{max-width:520px;margin:6px auto 4px}
.photo img{width:100%;height:auto;max-height:440px;-o-object-fit:contain;object-fit:contain;border-radius:4px;background:#fff;border:1px solid #DADADA;display:block}
.letters{text-align:center;margin:8px 0 2px}
.tile{display:inline-block;width:46px;height:54px;line-height:52px;margin:4px;border-radius:4px;border:1px dashed #BBBBBB;font-family:'Montserrat',sans-serif;font-weight:700;font-size:26px;color:#BBBBBB;background:#fff;vertical-align:top}
.tile.on{border:1px solid #49B190;background:#49B190;color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#457865;background:#E3F3EC;border-radius:3px;padding:2px 8px;margin-bottom:8px}
.map{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;margin:24px auto 0;max-width:700px}
.map button{width:40px;height:40px;margin:3px;border-radius:4px;border:1px solid #DADADA;background:#fff;color:#777;font-size:13px;font-weight:600;cursor:pointer;padding:0;-webkit-appearance:none}
.map button.done{background:#49B190;border-color:#49B190;color:#fff}
.map button.miss{background:#F3D9D2;border-color:#E2B4A8;color:#9b4430}
.map button.cur{box-shadow:0 0 0 2px #457865}
.map button.rb{border-radius:50%}
.maplegend{text-align:center;font-size:13px;margin-top:6px}
.res-table{width:100%;border-collapse:collapse;margin:14px 0;text-align:left;font-size:15px;background:#fff}
.res-table th,.res-table td{border-bottom:1px solid #EAEAEA;padding:9px 8px;vertical-align:top}
.res-table th{font-family:'Montserrat',sans-serif;color:#457865;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.res-table td.q{color:#323232}
.ok-ic{color:#49B190;font-weight:700}
.no-ic{color:#C0573E;font-weight:700}
.big-score{font-family:'Montserrat',sans-serif;font-weight:700;font-size:54px;color:#49B190;line-height:1.1;margin:4px 0}
.parts{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;margin:10px 0}
.parts div{background:#fff;border-radius:4px;padding:10px 14px;margin:5px;min-width:130px}
.parts b{display:block;font-family:'Montserrat',sans-serif;color:#323232;font-size:22px}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(50,50,50,.45);display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:20;padding:20px}
.modal.show{display:-webkit-box;display:-webkit-flex;display:flex}
.modal .box{background:#fff;border-radius:4px;max-width:420px;padding:26px;text-align:center}
.modal h4{font-family:'Montserrat',sans-serif;color:#323232;margin:0 0 8px;font-size:19px}
.splash img{display:block;margin:10px auto 0;width:120px;height:auto}
.rules{text-align:left;max-width:520px;margin:12px auto 18px;padding-left:20px;line-height:1.8}
.chips{margin-top:12px}
.chips span{margin-right:8px;font-size:15px}
.chip{display:inline-block;border:1px solid #49B190;color:#457865;background:#fff;border-radius:16px;padding:5px 16px;margin:3px;cursor:pointer;font-size:15px;-webkit-appearance:none}
.chip.sel{background:#49B190;color:#fff}
footer{text-align:center;font-size:12px;color:#BBBBBB;padding:0 0 30px}
@media (max-width:600px){
  header.top img{height:44px}
  h1{font-size:30px}
  .card{padding:54px 16px 22px}
  .card h3{font-size:19px}
  .tile{width:36px;height:46px;line-height:44px;font-size:21px;margin:3px}
}
</style>
</head>

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function rec(id){ if(!S.a[id]) S.a[id] = {v:'', tries:0, ok:false, done:false}; return S.a[id]; }

/* ---------- Answer matching ---------- */
var ACC = {'à':'a','á':'a','â':'a','ä':'a','ç':'c','è':'e','é':'e','ê':'e','ë':'e','î':'i','ï':'i','ô':'o','ö':'o','ù':'u','û':'u','ü':'u','œ':'oe'};
function norm(s){
  s = String(s||'').toLowerCase();
  s = s.replace(/[à-ÿœ]/g, function(c){ return ACC[c] || c; });
  return s.replace(/[^a-z0-9]+/g,' ').replace(/^\s+|\s+$/g,'');
}
function matches(input, item){
  var sp = norm(input);
  if(!sp) return false;
  if(item.exact){ var w = sp.replace(/^the letter /,'').replace(/^letter /,''); return w === item.groups[0][0]; }
  var ns = sp.replace(/ /g,'');
  var nums = (' ' + sp.replace(/([0-9])([a-z])/g,'$1 $2').replace(/([a-z])([0-9])/g,'$1 $2') + ' ');
  for(var g=0; g<item.groups.length; g++){
    var grp = item.groups[g], ok = true;
    for(var t=0; t<grp.length; t++){
      var tok = grp[t];
      if(tok.charAt(0)==='#'){ if(nums.indexOf(' '+tok.slice(1)+' ') < 0){ ok=false; break; } }
      else if(sp.indexOf(tok) < 0 && ns.indexOf(tok.replace(/ /g,'')) < 0){ ok=false; break; }
    }
    if(ok) return true;
  }
  return false;
}

/* ---------- Scoring ---------- */
function partScore(list){ var s=0,n=0; for(var k=0;k<list.length;k++){ n++; var r=S.a[list[k].id]; if(r && r.ok) s++; } return {s:s,n:n}; }
function scores(){
  var p1 = partScore(QUESTIONS), rb = partScore(REBUSES), p2 = partScore(RIDDLES.concat([RIDDLE_WORD])), p3 = partScore(PHOTOS.concat([PHOTO_WORD]));
  return {p1:p1, rb:rb, p2:p2, p3:p3, s:p1.s+rb.s+p2.s+p3.s, n:p1.n+rb.n+p2.n+p3.n};
}

function header(){
  var sc = scores();
  $('hdrScore').innerHTML = S.team ? esc(S.team) + '<small>' + sc.s + ' / ' + sc.n + ' points</small>' : '';

}

function go(n){
  if(n<0) n=0; if(n>STEPS.length-1) n=STEPS.length-1;
  S.step = n; save(); render();
  try{ window.scrollTo(0,0); }catch(e){}
}

function navHtml(){
  var st = STEPS[S.step];
  var next = S.step < STEPS.length-1 ? '<button class="btn outline" id="nNext">Next →</button>' : '';
  return '<div class="nav"><button class="btn ghost" id="nPrev">← Back</button><span class="count">'+ stepLabel(st) +'</span>'+ next +'</div>';
}
function stepLabel(st){
  if(st.type==='q') return 'Question '+st.n+' of 20';
  if(st.type==='rebus') return 'Rebus '+st.n+' of 5';
  if(st.type==='riddle') return 'Riddle '+st.n+' of 7';
  if(st.type==='photo') return 'Photo '+st.n+' of 8';
  return '';
}
function bindNav(){
  var p = $('nPrev'), n = $('nNext');
  if(p) p.onclick = function(){ go(S.step-1); };
  if(n) n.onclick = function(){ go(S.step+1); };
}

function mapHtml(){
  var h = '<div class="map">';
  for(var k=1;k<STEPS.length;k++){
    var st = STEPS[k], lab, cls = '';
    if(st.type==='q') lab = st.n;
    else if(st.type==='rebus'){ lab = 'R'+st.n; cls='rb'; }
    else if(st.type==='riddle') lab = 'D'+st.n;
    else if(st.type==='photo') lab = 'P'+st.n;
    else if(st.type==='word') lab = '★';
    else continue;
    var r = S.a[st.item.id];
    if(r && r.done) cls += r.ok ? ' done' : ' miss';
    if(k===S.step) cls += ' cur';
    h += '<button class="'+cls+'" data-go="'+k+'">'+lab+'</button>';
  }
  h += '</div><p class="maplegend">Tap a number to jump to it. Green = correct, red = missed. R = rebus, D = riddle, P = photo.</p>';
  return h;
}
function bindMap(){
  var bs = app.querySelectorAll('[data-go]');
  for(var k=0;k<bs.length;k++) bs[k].onclick = function(){ go(parseInt(this.getAttribute('data-go'),10)); };
}

        '<li>Your answers are saved on this device, so you can close the page and come back.</li>'+
      '</ul>'+
      '<div class="answer-row"><input class="txt" id="team" maxlength="40" placeholder="Your team name" value="'+esc(S.team)+'"></div>'+
      '<p><button class="btn" id="startBtn">'+(S.team ? 'Continue' : 'Start the quiz')+'</button></p>'+
      (S.team ? '<p><button class="btn ghost" id="resetBtn">Start again with a new team</button></p>' : '')+
    '</div>';
  $('startBtn').onclick = function(){
    var t = $('team').value.replace(/^\s+|\s+$/g,'');
    if(!t){ $('team').focus(); $('team').placeholder = 'Please enter a team name'; return; }
    S.team = t; save();
    go(S.step > 0 ? S.step : 1);
  };
  $('team').onkeydown = function(e){ if(e.keyCode===13) $('startBtn').onclick(); };
  if($('resetBtn')) $('resetBtn').onclick = resetAll;
}

function resetAll(){
  confirmBox('Start again?', 'All answers on this device will be deleted.', 'Delete and restart', function(){
    S = {team:'', step:0, a:{}}; save(); render();
  });
}

function renderIntro(part){
  var d = {
    1:{icon:ICON_PLANE, k:'Part 1', t:'Museum questions', p:'Walk around the museum to answer 20 questions. Look out for the 5 rebus puzzles along the way: each one hides an English word or expression.'},
    2:{icon:ICON_KEY, k:'Part 2', t:'Riddles', p:'Solve 7 riddles. Each correct answer gives you a letter. Put the letters together to find a famous aviation pioneer.'},
    3:{icon:ICON_CAMERA, k:'Part 3', t:'Photo hunt', p:'Find the aircraft in each photo and write its name. Each one gives you a letter. Unscramble them to find another famous aviator.'}
  }[part];
  app.innerHTML = '<p class="kicker">'+d.k+'</p><h2 class="section">'+d.t+'</h2>'+
    '<div class="card"><div class="badge">'+d.icon+'</div><p class="intro" style="margin-bottom:6px">'+d.p+'</p>'+
    '<button class="btn" id="goOn">Let’s go</button></div>'+ navHtml() + mapHtml();
  $('goOn').onclick = function(){ go(S.step+1); };
  bindNav(); bindMap();
}

function feedbackHtml(item, r, extraRight){
  if(!r.done && r.tries===1) return '<div class="fb no show">Not quite. Read the question again and have another try.</div>';
  if(!r.done) return '<div class="fb" id="fb"></div>';
  var shown = item.show ? '<b>'+esc(item.show)+'</b>' : '';
  if(r.ok) return '<div class="fb ok show">✔ Correct! '+(item.show ? 'Answer: '+shown+'.' : '')+(extraRight||'')+'</div>';
  return '<div class="fb no show">The answer was '+shown+'.'+(extraRight||'')+'</div>';
}

function renderTyped(st){
  var item = st.item, r = rec(item.id);
  var tag, badge, body = '';
  if(st.type==='q'){ tag='Question'; badge=st.n; }
  else if(st.type==='rebus'){ tag='Rebus puzzle'; badge=ICON_PUZZLE; }
  else if(st.type==='riddle'){ tag='Riddle'; badge=ICON_KEY; }
  else { tag='Photo hunt'; badge=ICON_CAMERA; }

  var title = item.text || '';
  if(st.type==='rebus'){ title = 'What word or expression does this picture show?'; body = '<div class="rebus">'+item.html+'</div>'; }
  if(st.type==='photo'){ title = 'Which aircraft is this?'; body = '<div class="photo"><img src="'+item.img+'" alt="Detail of an aircraft in the museum"></div>'; }

  var extra = '';
  if(st.type==='rebus' && r.done) extra = '<br>' + item.meaning;
  if((st.type==='riddle' || st.type==='photo') && r.done && r.ok) extra = ' You win the letter <b>'+item.letter+'</b>.';

  var hint = '';
  if(st.type==='rebus' && !r.done){
    hint = r.hint ? '<div class="fb info show">💡 '+esc(item.hint)+'</div>' : '<button class="btn ghost" id="hintBtn">Show a hint</button>';
  }

  var buy = '';
  if(item.buy){
    buy = '<div class="chips"><span>And would you buy it?</span>'+
      '<button class="chip'+(S.a.buy==='yes'?' sel':'')+'" data-buy="yes">Yes!</button>'+
      '<button class="chip'+(S.a.buy==='no'?' sel':'')+'" data-buy="no">No way</button></div>';
  }

  app.innerHTML =
    '<div class="card"><div class="badge">'+badge+'</div>'+
      '<span class="tag">'+tag+'</span>'+
      '<h3>'+esc(title)+'</h3>'+ (item.sub ? '<p class="sub">'+esc(item.sub)+'</p>' : '') +
      body +
      '<div class="answer-row"><input class="txt" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" value="'+esc(r.v)+'"'+(r.done?' disabled':'')+'></div>'+
      (r.done ? '' : '<p><button class="btn" id="checkBtn">Check</button><button class="btn ghost" id="giveBtn">Show the answer</button></p>') +
      hint + feedbackHtml(item, r, extra) + buy +
      (st.type==='riddle' || st.type==='photo' ? lettersHtml(st.type==='riddle' ? RIDDLES : PHOTOS) : '') +
    '</div>' + navHtml() + mapHtml();

  if(!r.done){
    $('checkBtn').onclick = function(){
      var v = $('ans').value;
      if(!norm(v)){ $('ans').focus(); return; }
      r.v = v; r.tries++;
      if(matches(v, item)){ r.ok = true; r.done = true; }
      else if(r.tries >= 2){ r.done = true; }
      save(); render();
      if(!r.done){ try{ $('ans').focus(); $('ans').select(); }catch(e){} }
    };
    $('ans').onkeydown = function(e){ if(e.keyCode===13) $('checkBtn').onclick(); };
    $('giveBtn').onclick = function(){
      confirmBox('Show the answer?', 'You will not get a point for this one.', 'Show it', function(){
        r.v = $('ans').value; r.done = true; r.ok = false; save(); render();
      });
    };
    if($('hintBtn')) $('hintBtn').onclick = function(){ r.hint = true; save(); render(); };
  }
  var chips = app.querySelectorAll('[data-buy]');
  for(var k=0;k<chips.length;k++) chips[k].onclick = function(){ S.a.buy = this.getAttribute('data-buy'); save(); render(); };
  bindNav(); bindMap();
}

function renderChoice(st){
  var item = st.item, r = rec(item.id);
  if(!r.sel) r.sel = [];
  var need = item.correct.length;
  var h = '';
  for(var k=0;k<item.opts.length;k++){
    var cls = 'opt';
    var isSel = r.sel.indexOf(k) >= 0, isRight = item.correct.indexOf(k) >= 0;
    if(r.done){ if(isRight) cls += ' right'; else if(isSel) cls += ' wrong'; }
    else if(isSel) cls += ' sel';
    h += '<button class="'+cls+'" data-o="'+k+'"'+(r.done?' disabled':'')+'><span class="l">'+'ABCD'.charAt(k)+'</span>'+esc(item.opts[k])+'</button>';
  }
  var rightTxt = [];
  for(k=0;k<item.correct.length;k++) rightTxt.push(item.opts[item.correct[k]]);
  var fb = '';
  if(r.done) fb = r.ok ? '<div class="fb ok show">✔ Correct!</div>' : '<div class="fb no show">The right answer'+(need>1?'s were':' was')+' <b>'+esc(rightTxt.join(' and '))+'</b>.</div>';

  app.innerHTML =
    '<div class="card"><div class="badge">'+st.n+'</div><span class="tag">Question</span>'+
      '<h3>'+esc(item.text)+'</h3>'+
      '<p class="sub">'+(need>1 ? 'Choose <b>'+need+'</b> answers.' : 'Choose one answer.')+'</p>'+
      '<div class="opts">'+h+'</div>'+
      (r.done ? '' : '<p><button class="btn" id="checkBtn"'+(r.sel.length===need?'':' disabled')+'>Check</button></p>')+
      fb +
    '</div>' + navHtml() + mapHtml();

  if(!r.done){
    var bs = app.querySelectorAll('[data-o]');
    for(k=0;k<bs.length;k++) bs[k].onclick = function(){
      var o = parseInt(this.getAttribute('data-o'),10), p = r.sel.indexOf(o);
      if(p>=0) r.sel.splice(p,1);
      else { if(need===1) r.sel = [o]; else if(r.sel.length < need) r.sel.push(o); else { r.sel.shift(); r.sel.push(o); } }
      save(); render();
    };
    $('checkBtn').onclick = function(){
      if(r.sel.length!==need) return;
      var ok = true;
      for(var z=0; z<r.sel.length; z++) if(item.correct.indexOf(r.sel[z])<0) ok = false;
      r.ok = ok; r.done = true; r.v = r.sel.map(function(x){ return item.opts[x]; }).join(', ');
      save(); render();
    };
  }
  bindNav(); bindMap();
}

function lettersHtml(set){
  var h = '<div class="letters">';
  for(var k=0;k<set.length;k++){ var r = S.a[set[k].id], on = r && r.done; h += '<span class="tile'+(on?' on':'')+'">'+(on ? set[k].letter : '?')+'</span>'; }
  return h + '</div>';
}

function renderWord(st){
  var item = st.item, r = rec(item.id);
  var miss = 0;
  for(var k=0;k<st.set.length;k++){ var x = S.a[st.set[k].id]; if(!x || !x.done) miss++; }
  var note = miss ? '<p class="sub">You still have '+miss+' letter'+(miss>1?'s':'')+' to find. You can try now or go back first.</p>' : '<p class="sub">You have all your letters!</p>';
  var fb = '';
  if(r.done) fb = '<div class="fb '+(r.ok?'ok':'no')+' show">'+(r.ok?'✔ Brilliant! ':'The answer was ')+'<b>'+esc(item.show)+'</b>. '+esc(item.meaning)+'</div>';
  else if(r.tries===1) fb = '<div class="fb no show">Not quite. Try another order!</div>';
  app.innerHTML =
    '<p class="kicker">Part '+st.part+'</p><h2 class="section">Mystery name</h2>'+
    '<div class="card"><div class="badge">★</div>'+
      '<h3>'+esc(item.text)+'</h3>'+ note + lettersHtml(st.set) +
      '<div class="answer-row"><input class="txt" id="ans" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Mystery name" value="'+esc(r.v)+'"'+(r.done?' disabled':'')+'></div>'+
      (r.done ? '' : '<p><button class="btn" id="checkBtn">Check</button><button class="btn ghost" id="giveBtn">Show the answer</button></p>') + fb +
    '</div>' + navHtml() + mapHtml();
  if(!r.done){
    $('checkBtn').onclick = function(){
      var v = $('ans').value; if(!norm(v)) return;
      r.v = v; r.tries++;
      if(matches(v,item)){ r.ok = true; r.done = true; } else if(r.tries>=2) r.done = true;
      save(); render();
    };
    $('ans').onkeydown = function(e){ if(e.keyCode===13) $('checkBtn').onclick(); };
    $('giveBtn').onclick = function(){ confirmBox('Show the answer?', 'You will not get a point for this one.', 'Show it', function(){ r.v=$('ans').value; r.done=true; save(); render(); }); };
  }
  bindNav(); bindMap();
}

function renderResults(){
  var sc = scores();
  var rows = '';
  function row(label, item, shown){
    var r = S.a[item.id] || {};
    var ic = r.done ? (r.ok ? '<span class="ok-ic">✔</span>' : '<span class="no-ic">✘</span>') : '–';
    rows += '<tr><td>'+ic+'</td><td class="q">'+label+'</td><td>'+esc(r.v || '')+'</td><td>'+esc(shown)+'</td></tr>';
  }
  for(var k=1;k<STEPS.length;k++){
    var st = STEPS[k], it = st.item;
    if(st.type==='q') row('Q'+st.n+'. '+esc(it.text), it, it.show || it.correct.map(function(x){ return it.opts[x]; }).join(' + '));
    else if(st.type==='rebus') row('Rebus '+st.n, it, it.show);
    else if(st.type==='riddle') row('Riddle '+st.n+' ('+it.letter+')', it, it.show);
    else if(st.type==='photo') row('Photo '+st.n+' ('+it.letter+')', it, it.show);
    else if(st.type==='word') row('<b>Mystery name, part '+st.part+'</b>', it, it.show);
  }
  var todo = 0;
  for(k=0;k<ALL_ITEMS.length;k++){ var rr = S.a[ALL_ITEMS[k].id]; if(!rr || !rr.done) todo++; }
  app.innerHTML =
    '<p class="kicker">Results</p><h2 class="section">'+esc(S.team || 'Your team')+'</h2>'+
    '<div class="card"><div class="badge">★</div>'+
      '<div class="big-score">'+sc.s+' / '+sc.n+'</div><p class="sub">points</p>'+
      (todo ? '<p class="sub">'+todo+' question'+(todo>1?'s':'')+' not answered yet. Tap a grey number below to finish.</p>' : '')+
      '<div class="parts">'+
        '<div>Museum questions<b>'+sc.p1.s+' / '+sc.p1.n+'</b></div>'+
        '<div>Rebus puzzles<b>'+sc.rb.s+' / '+sc.rb.n+'</b></div>'+
        '<div>Riddles<b>'+sc.p2.s+' / '+sc.p2.n+'</b></div>'+
        '<div>Photo hunt<b>'+sc.p3.s+' / '+sc.p3.n+'</b></div>'+
      '</div>'+
      (S.a.buy ? '<p class="sub">Would you buy the big propeller? <b>'+(S.a.buy==='yes'?'Yes!':'No way')+'</b></p>' : '')+
      '<p><button class="btn outline" id="showTbl">See all answers</button><button class="btn ghost" id="resetBtn2">Start again</button></p>'+
      '<div id="tbl" style="display:none;overflow-x:auto"><table class="res-table"><tr><th></th><th>Question</th><th>Your answer</th><th>Correct answer</th></tr>'+rows+'</table></div>'+
    '</div>' + navHtml() + mapHtml();
  $('showTbl').onclick = function(){ var t=$('tbl'); var on = t.style.display==='none'; t.style.display = on?'block':'none'; this.textContent = on?'Hide answers':'See all answers'; };
  $('resetBtn2').onclick = resetAll;
  bindNav(); bindMap();
}

function render(){
  header();
  if(!S.team && S.step>0) S.step = 0;
  var st = STEPS[S.step];
  if(st.type==='start') renderStart();
  else if(st.type==='intro') renderIntro(st.part);
  else if(st.type==='q' && st.item.opts) renderChoice(st);
  else if(st.type==='q' || st.type==='rebus' || st.type==='riddle' || st.type==='photo') renderTyped(st);
  else if(st.type==='word') renderWord(st);
  else renderResults();
}

load();
render();
window.__quiz = {matches:matches, QUESTIONS:QUESTIONS, REBUSES:REBUSES, RIDDLES:RIDDLES, PHOTOS:PHOTOS, STEPS:STEPS};
})();
</script>
</body>
</html>
