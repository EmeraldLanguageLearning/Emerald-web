<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#49B190">
<title>Trainer area · Emerald Language Learning</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;color:#777;background:#fff;line-height:1.7;-webkit-text-size-adjust:100%}
header{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:10px 4%;border-bottom:1px solid #DADADA}
header img{height:60px;width:auto;display:block}
main{width:92%;max-width:980px;margin:0 auto;padding:20px 0 60px}
h1{font-family:'Montserrat',sans-serif;font-weight:300;text-transform:uppercase;color:#457865;text-align:center;font-size:38px;letter-spacing:1px;line-height:1.25;margin:28px 0 6px}
.intro{text-align:center;max-width:620px;margin:0 auto 10px;line-height:1.9}
.btn{display:inline-block;background:#49B190;color:#fff;border:1px solid #49B190;border-radius:4px;padding:11px 24px;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;-webkit-appearance:none;font-family:inherit;margin:4px}
.btn:hover{background:#3f9c7e;border-color:#3f9c7e}
.btn.outline{background:#fff;color:#457865}
.btn.outline:hover{background:#EEF7F3}
.lockbtn{background:#fff;color:#457865;border:1px solid #BBBBBB;border-radius:4px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit;-webkit-appearance:none}
/* PIN pad */
.pin{max-width:330px;margin:10px auto 0;text-align:center}
.dots{margin:16px 0 18px}
.dots span{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #49B190;margin:0 9px}
.dots span.on{background:#49B190}
.dots.shake{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}25%,75%{-webkit-transform:translateX(-10px)}50%{-webkit-transform:translateX(10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
.keys{overflow:hidden}
.keys button{float:left;width:29.33%;margin:2%;height:72px;border-radius:4px;border:1px solid #DADADA;background:#F9F9F9;font-family:'Montserrat',sans-serif;font-size:26px;color:#323232;cursor:pointer;-webkit-appearance:none;padding:0}
.keys button:active{background:#E3F3EC;border-color:#49B190}
.keys button.fn{font-family:'Open Sans',sans-serif;font-size:15px;color:#777;background:#fff}
.err{color:#C0573E;min-height:26px;font-size:15px}
/* Quiz cards */
.grid{overflow:hidden;margin:40px -1.5% 0}
.card{float:left;width:47%;margin:56px 1.5% 10px;background:#F9F9F9;border-radius:4px;padding:58px 24px 26px;text-align:center;position:relative}
.badge{position:absolute;left:50%;top:-44px;margin-left:-44px;width:88px;height:88px;border-radius:50%;background:#49B190;border:4px solid #fff;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.badge svg{width:42px;height:42px}
.card h3{font-family:'Montserrat',sans-serif;font-weight:700;color:#323232;font-size:21px;margin:0 0 2px;line-height:1.4}
.card .where{color:#72B1A0;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;margin:0 0 10px}
.card p{line-height:1.9;margin:0 0 14px}
.note{text-align:center;font-size:13px;color:#999;margin-top:30px}
.hidden{display:none}
@media (max-width:700px){ .card{width:97%} header img{height:44px} h1{font-size:28px} }
</style>
</head>

<main>
  <!-- Locked view -->
  <section id="locked">
    <h1>Trainer area</h1>
    <p class="intro">Enter the trainer PIN to open the quizzes.</p>
    <div class="pin">
      <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
      <div class="err" id="err"></div>
      <div class="keys" id="keys"></div>
    </div>
  </section>

  <!-- Unlocked view -->
  <section id="open" class="hidden">
    <h1>Quizzes</h1>
    <p class="intro">Open a quiz on this iPad and hand it to the team. Each quiz saves its progress on the device; use “Start again” inside the quiz for a new team.</p>
    <div class="grid" id="grid"></div>
    <p class="note">The trainer area locks again when Safari is closed, or when you tap Lock.</p>
  </section>
</main>
<script>
(function(){
'use strict';
/* Add new quizzes here. */
var QUIZZES = [
  {title:'Aeroscopia Quiz', where:'Museum · Blagnac, Toulouse', url:'aeroscopia/', icon:'plane',
   text:'20 museum questions with 5 rebus puzzles, 7 riddles and a photo hunt around the aircraft.'},
  {title:'Gaillac History Tour', where:'Walking tour · Gaillac', url:'https://emeraldlanguagelearning.github.io/Emerald-Gaillac-Quiz-Tour/', icon:'map',
   text:'A walking quiz through the historic centre of Gaillac, stop by stop.'}
];
var ICONS = {
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>'
};

/* The PIN is not stored in plain text. Note: this only keeps students out of the menu; it is not real security. */
var PIN_HASH = 2085847969;
function h(s){ var x = 5381; for(var k=0;k<s.length;k++){ x = ((x*33) ^ s.charCodeAt(k)) >>> 0; } return x; }

var KEY = 'ell-trainer-ok';
function isOpen(){ try{ return sessionStorage.getItem(KEY)==='1'; }catch(e){ return window.__ok===true; } }
function setOpen(v){ try{ if(v) sessionStorage.setItem(KEY,'1'); else sessionStorage.removeItem(KEY); }catch(e){} window.__ok = v; }

function $(id){ return document.getElementById(id); }
var entry = '';

function drawDots(){ var d = $('dots').children; for(var k=0;k<d.length;k++) d[k].className = k<entry.length ? 'on' : ''; }

function press(v){
  $('err').textContent = '';
  if(v==='del'){ entry = entry.slice(0,-1); drawDots(); return; }
  if(v==='clr'){ entry = ''; drawDots(); return; }
  if(entry.length>=4) return;
  entry += v; drawDots();
  if(entry.length===4){
    setTimeout(function(){
      if(h(entry)===PIN_HASH){ setOpen(true); entry=''; show(); }
      else {
        $('err').textContent = 'Wrong PIN. Try again.';
        var d = $('dots'); d.className = 'dots shake'; setTimeout(function(){ d.className='dots'; }, 450);
        entry = ''; drawDots();
      }
    }, 150);
  }
}

function buildKeys(){
  var order = ['1','2','3','4','5','6','7','8','9','clr','0','del'], html = '';
  for(var k=0;k<order.length;k++){
    var v = order[k], lab = v==='clr' ? 'Clear' : v==='del' ? '⌫' : v;
    html += '<button class="'+(v.length>1?'fn':'')+'" data-k="'+v+'" aria-label="'+(v==='del'?'Delete':lab)+'">'+lab+'</button>';
  }
  $('keys').innerHTML = html;
  var bs = $('keys').getElementsByTagName('button');
  for(k=0;k<bs.length;k++) bs[k].onclick = function(){ press(this.getAttribute('data-k')); };
  document.onkeydown = function(e){
    if(isOpen()) return;
    var c = e.key || String.fromCharCode(e.keyCode);
    if(/^[0-9]$/.test(c)) press(c); else if(e.keyCode===8) press('del');
  };
}

function buildGrid(){
  var html = '';
  for(var k=0;k<QUIZZES.length;k++){
    var q = QUIZZES[k];
    html += '<div class="card"><div class="badge">'+(ICONS[q.icon]||ICONS.plane)+'</div>'+
      '<h3>'+q.title+'</h3><p class="where">'+q.where+'</p><p>'+q.text+'</p>'+
      '<a class="btn" href="'+q.url+'">Open quiz</a></div>';
  }
  $('grid').innerHTML = html;
}

function show(){
  var o = isOpen();
  $('locked').className = o ? 'hidden' : '';
  $('open').className = o ? '' : 'hidden';
  $('lockBtn').className = o ? 'lockbtn' : 'lockbtn hidden';
}
$('lockBtn').onclick = function(){ setOpen(false); show(); };

buildKeys(); buildGrid(); show();
})();
</script>
</body>
</html>
