<style>
:root{
  /* Emerald Language Learning palette */
  --emerald:#49B190; --emerald-link:#53AC90; --emerald-dark:#457865; --emerald-soft:#72B1A0; --emerald-hover:#3f9c7e;
  --ink:#323232; --muted:#777777; --faint:#a3a3a3; --line:#DADADA; --line-strong:#BBBBBB; --bg:#ffffff; --panel:#F9F9F9;
  --accent:#49B190; --accent-soft:#e9f6f1;
  /* annotation marks */
  --ul:#c8443a; --hl:#fde68a; --arrow:#2f8f6a; --bubble:#49B190; --pause:#323232; --speak:#457865;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --body:"Open Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--muted);font-family:var(--body);line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1080px;width:80%;margin:0 auto}
@media (max-width:720px){.wrap{width:auto;padding-left:18px;padding-right:18px}}

/* site header */
.site{background:#fff;border-bottom:1px solid var(--line)}
.site-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.brand-logo{height:60px;width:auto;display:block}
.brand-home{display:block;line-height:0;border-radius:6px;cursor:pointer;transition:opacity .15s}.brand-home:hover{opacity:.85}.brand-home:focus-visible{outline:3px solid #49B190;outline-offset:3px}
@media (max-width:520px){.brand-logo{height:44px}.site-in{padding-block:12px}}
.lang{display:inline-flex;border:1px solid var(--emerald);border-radius:4px;overflow:hidden;flex:none}
.lang button{font:600 .85rem var(--body);letter-spacing:.04em;border:0;border-radius:0;background:#fff;color:var(--emerald-dark);padding:7px 13px;cursor:pointer}
.lang button+button{border-left:1px solid var(--emerald)}
.lang button:hover{background:var(--accent-soft)}
.lang button[aria-pressed="true"]{background:var(--emerald);color:#fff}

main.wrap{padding-block:36px 72px}
.title-block{text-align:center;margin-bottom:28px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.25;text-transform:uppercase;color:var(--emerald-dark);margin:0 0 10px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:1rem;margin:0 auto;max-width:62ch}
.sub b{color:var(--ink)}

textarea{width:100%;min-height:100px;font:inherit;font-size:1rem;padding:12px 14px;border:1px solid var(--line);border-radius:4px;resize:vertical;color:var(--ink);background:var(--panel)}
textarea:focus{outline:none;border-color:var(--emerald);background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{font:600 .88rem var(--body);border:1px solid var(--emerald);background:#fff;color:var(--emerald-dark);border-radius:4px;padding:8px 12px;cursor:pointer}
select{font-weight:400;color:var(--ink);border-color:var(--line)}
button:hover{background:var(--accent-soft)}
button.primary{background:var(--emerald);border-color:var(--emerald);color:#fff}
button.primary:hover{background:var(--emerald-hover);border-color:var(--emerald-hover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--emerald-dark);outline-offset:2px}
.acc{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}

.tools{position:-webkit-sticky;position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-top:8px}
.tool{display:inline-flex;align-items:center;gap:6px;border-color:var(--line);color:var(--muted);font-weight:600}
.tool:hover{border-color:var(--emerald);color:var(--emerald-dark);background:#fff}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--emerald);color:var(--emerald-dark);box-shadow:inset 0 -2px 0 var(--emerald)}
.ico{display:inline-flex;width:22px;height:20px;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.ico.ul span{text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:3px;text-underline-offset:3px}
.ico.hl span{background:var(--hl);padding:0 3px;border-radius:3px}
.ico.up,.ico.down{color:var(--arrow);font-size:1.15rem;font-family:system-ui,'Segoe UI Symbol','Noto Sans',sans-serif}
.ico.bub{gap:2px}
.ico.bub i{display:inline-block;border-radius:50%;border:2px solid var(--bubble)}
.ico.bub i.s{width:7px;height:7px}
.ico.bub i.b{width:12px;height:12px;background:var(--bubble)}
.ico.bar{display:inline-flex;height:20px;border:0}
.ico.bar i{display:inline-block;height:16px;border-left:3px solid var(--pause)}
.ico.dot i{display:inline-block;height:16px;border-left:3px dotted var(--pause)}
.hint{font-size:.88rem;color:var(--emerald-dark);min-height:1.2em;margin-top:6px}

.board{position:relative;font-size:1.45rem;line-height:1.1;padding:18px 14px 22px;border:1px solid var(--line);border-radius:4px;min-height:120px;margin-top:16px;user-select:none;-webkit-user-select:none;background:#fff;color:var(--ink)}
.board.empty::before{content:attr(data-empty);color:var(--faint);font-size:1rem;font-family:var(--body)}
.para{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:14px;margin-bottom:16px}
.para:last-child{margin-bottom:0}
.w{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding-top:26px;cursor:pointer;border-radius:4px}
.w:hover .txt{background:rgba(73,177,144,.10)}
.w .above{position:absolute;top:3px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:4px;height:18px;pointer-events:none}
.b{display:inline-block;border-radius:50%;border:2px solid var(--bubble);width:9px;height:9px;flex:none}
.b.big{width:16px;height:16px;background:var(--bubble)}
.w .txt{padding:2px 2px 6px;border-radius:4px;white-space:nowrap}
.core{border-radius:4px;padding:0 1px}
.w.hl .core{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.w.ul .core{text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:3px;text-underline-offset:6px}
.arr{position:absolute;top:2px;right:-11px;font-size:1.05rem;font-family:system-ui,'Segoe UI Symbol','Noto Sans',sans-serif;font-weight:700;color:var(--arrow);pointer-events:none}
.w.speak .txt{outline:2px solid var(--speak);outline-offset:1px}
.g{display:inline-flex;align-self:stretch;align-items:flex-end;justify-content:center;width:16px;padding-bottom:4px;cursor:pointer;border-radius:4px}
.g:hover{background:rgba(73,177,144,.10)}
.bar{display:block;height:1.35em;border-left:3px solid var(--pause)}
.bar.short{border-left-style:dotted}
.bar.counting{border-left-color:var(--emerald)}
.board.hidden-marks .above,.board.hidden-marks .arr,.board.hidden-marks .bar{visibility:hidden}
.board.hidden-marks .w.hl .core{background:none;box-shadow:none}
.board.hidden-marks .w.ul .core{text-decoration:none}

.panel{background:var(--panel);border-radius:4px;padding:14px 16px;margin-top:14px}
.ipa h3{margin:0;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ipa .ipahead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.ipa .ipahead label{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.ipatext{font-family:"Noto Sans","Doulos SIL","Charis SIL","Lucida Sans Unicode","Segoe UI",sans-serif;font-size:1.3rem;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;color:var(--ink)}
.ipatext .unk{color:#b45309;border-bottom:1px dashed #b45309}
.ipatext .msg{font-family:var(--body);font-size:.95rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}
.badge{font-size:.72rem;font-weight:600;color:#b45309;background:#fef3c7;border-radius:4px;padding:2px 6px;font-family:var(--body)}
.listen{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.listen label{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
input[type=range]{accent-color:var(--emerald)}
input[type=checkbox]{accent-color:var(--emerald)}
.countdown{font-size:.9rem;color:var(--emerald-dark);font-weight:700;min-width:6em}

.legend-wrap h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--emerald-dark);font-size:1.2rem;margin:36px 0 12px;text-align:center}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 20px;font-size:.9rem;color:var(--muted);background:var(--panel);border-radius:4px;padding:16px 18px}
.legend div{display:flex;align-items:center;gap:8px}
@media (max-width:560px){
  .board{font-size:1.25rem}
  .tool .tname{display:none}
}
.keep-ov{position:fixed;inset:0;background:rgba(50,50,50,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.keep-box{background:#fff;border-radius:4px;border-top:4px solid var(--emerald);max-width:440px;width:100%;padding:22px 22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}
.keep-box h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--emerald-dark);font-size:1.15rem;margin:0 0 10px}
.keep-box p{margin:0 0 6px;color:var(--muted)}
.keep-box .row{justify-content:center;margin:16px 0 0}
@media print{
  .keep-ov,.site,.tools,.inputarea,.listen,.legend-wrap .row,.ipa .ipahead label,.ipa .ipahead button,.ipa .note{display:none!important}
  .board{border:none}
}
</style>
<style id="emerald-dark">
/* Dark version of the Emerald look, used when the phone is in dark mode */
@media screen and (prefers-color-scheme: dark){
  :root{color-scheme:dark;--emerald-dark:#7fcbb0;--emerald-link:#6cc8a6;--ink:#edf2f0;--muted:#b6c2bd;--faint:#7d8a85;--line:#2f3b37;--line-strong:#4b5a55;
    --bg:#121816;--panel:#1a2320;--accent-soft:#1d3a31;--pause:#e6ece9;--speak:#7fcbb0;--arrow:#5fd19b;--ul:#f07a6e;--hl:#7a6516}
  textarea{background:#1a2320}
  textarea:focus{background:#1f2a26}
  button,select{background:transparent}
  select{background:#1f2a26}
  button.primary{background:#49B190;color:#fff}
  button.primary:hover{background:#3f9c7e}
  .tool:hover{background:transparent}
  .tool[aria-pressed="true"]{background:#1d3a31}
  .board,.ipatext{background:#161e1b}
  .ipatext .unk{color:#f2a85b;border-bottom-color:#f2a85b}
  .badge{background:#3a2f12;color:#f2c46b}

  .site{background:#161e1b!important;border-bottom-color:#2f3b37!important}
  .brand-logo{background:#fff;border-radius:6px;padding:4px 8px;box-sizing:content-box}
  .lang button{background:transparent!important;color:#7fcbb0!important}
  .lang button[aria-pressed="true"]{background:#49B190!important;color:#fff!important}
  .app-home{background:transparent!important;color:#7fcbb0!important}
  .app-home:hover{background:#1d3a31!important}
}
</style>

        tokens.forEach(function (t, i) {
            if (t.t !== 'w')
                return;
            cur.push(i);
            if (t.pause) {
                segs.push({ idx: cur, pause: PAUSE[t.pause], at: i });
                cur = [];
            }
        });
        if (cur.length)
            segs.push({ idx: cur, pause: 0, at: null });
        return segs;
    }
    $('btnPlay').onclick = function () {
        if (!window.speechSynthesis) {
            setHint('noSpeech');
            return;
        }
        if (!tokens.length)
            return;
        var segs = segments(), n = 0;
        playing = true;
        $('btnPlay').disabled = true;
        $('btnStop').disabled = false;
        function next() {
            if (!playing)
                return;
            clearSpeak();
            if (n >= segs.length) {
                stop();
                return;
            }
            var s = segs[n++];
            s.idx.forEach(function (i) { var w = board.querySelector('.w[data-i="' + i + '"]'); if (w)
                w.classList.add('speak'); });
            var text = s.idx.map(function (i) { var t = tokens[i]; return t.pre + t.core + t.post; }).join(' ');
            var u = new SpeechSynthesisUtterance(text);
            var pv = pickVoice($('accent').value);
            u.lang = pv.voice ? pv.voice.lang : ACCENTS[$('accent').value].speech[0];
            if (pv.voice)
                u.voice = pv.voice;
            u.rate = parseFloat($('rate').value);
            u.onend = function () {
                if (!playing)
                    return;
                clearSpeak();
                if (s.pause) {
                    var bar = board.querySelector('.g[data-i="' + s.at + '"] .bar');
                    if (bar)
                        bar.classList.add('counting');
                    pauseLeft = s.pause / 1000;
                    $('countdown').textContent = T('pauseCount', { n: pauseLeft });
                    tick = setInterval(function () { pauseLeft--; if (pauseLeft > 0)
                        $('countdown').textContent = T('pauseCount', { n: pauseLeft }); }, 1000);
                    timer = setTimeout(function () { clearInterval(tick); $('countdown').textContent = ''; next(); }, s.pause);
                }
                else
                    next();
            };
            u.onerror = function () { if (playing)
                next(); };
            speechSynthesis.speak(u);
        }
        next();
    };
    $('btnStop').onclick = stop;
    if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = updateVoiceNote;
        setTimeout(updateVoiceNote, 300);
    }
    /* ---------- language switch ---------- */
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
        b.onclick = function () {
            if (b.dataset.lang === LANG)
                return;
            LANG = b.dataset.lang;
            try {
                localStorage.setItem('ell-lang', LANG);
            }
            catch (e) { }
            refreshUI();
        };
    });
    /* ---------- hourly keep / erase prompt ---------- */
    // Every hour after the last answer, ask: keep or erase? With no answer for 3 hours, erase.
    // Times are stored, so this also works when the page was closed in the meantime.
    var KEEP_KEY = KEY + '-keep', ASK_EVERY = 3600000, AUTO_ERASE = 3 * 3600000;
    function readKeep() { try {
        return JSON.parse(localStorage.getItem(KEEP_KEY) || 'null') || {};
    }
    catch (e) {
        return {};
    } }
    function writeKeep(k) { try {
        localStorage.setItem(KEEP_KEY, JSON.stringify(k));
    }
    catch (e) { } }
    function hasContent() {
        if (hasMarks())
            return true;
        var v = src.value.trim();
        var b = tokens.filter(function (t) { return t.t === 'w'; }).map(function (t) { return t.pre + t.core + t.post; }).join(' ');
        return (!!v && v !== DEFAULT_TEXT) || (!!b && b !== DEFAULT_TEXT);
    }
    function showKeep(askAt) {
        var d = new Date(askAt + AUTO_ERASE);
        $('keepWhen').textContent = T('keepWhen', { t: d.toLocaleTimeString(LANG === 'fr' ? 'fr-FR' : 'en-GB', { hour: '2-digit', minute: '2-digit' }) });
        if ($('keepOv').hidden) {
            $('keepOv').hidden = false;
            $('keepYes').focus();
        }
    }
    function hideKeep() { $('keepOv').hidden = true; }
    function clearLocal() {
        stop();
        resetAnnotateBtn();
        src.value = '';
        tokens = [];
        undo = [];
        $('btnUndo').disabled = true;
        render();
    }
    function eraseAll(auto) {
        clearLocal();
        save();
        writeKeep({ keptAt: Date.now(), askedAt: null });
        hideKeep();
        setHint(auto ? 'erased' : 'h_none');
    }
    function checkKeep() {
        var now = Date.now(), k = readKeep();
        if (!hasContent()) {
            writeKeep({ keptAt: now, askedAt: null });
            hideKeep();
            return;
        }
        if (!k.keptAt) {
            k = { keptAt: now, askedAt: null };
            writeKeep(k);
        }
        var askAt = k.askedAt || (k.keptAt + ASK_EVERY);
        if (now >= askAt + AUTO_ERASE) {
            eraseAll(true);
            return;
        }
        if (now >= askAt) {
            if (!k.askedAt) {
                k.askedAt = askAt;
                writeKeep(k);
            }
            showKeep(askAt);
        }
        else
            hideKeep();
    }
    $('keepYes').onclick = function () { writeKeep({ keptAt: Date.now(), askedAt: null }); hideKeep(); };
    $('keepNo').onclick = function () { eraseAll(false); };
    setInterval(checkKeep, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden)
        checkKeep(); });
    window.addEventListener('focus', checkKeep);
    window.addEventListener('storage', function (e) {
        if (e.key === KEY) { // erased in another tab
            try {
                var d = JSON.parse(e.newValue || 'null');
                if (d && !d.text && (!d.tokens || !d.tokens.length))
                    clearLocal();
            }
            catch (err) { }
        }
        if (e.key === KEY || e.key === KEEP_KEY)
            checkKeep();
    });
    /* ---------- init ---------- */
    if (!load())
        tokens = parse(src.value);
    render();
    refreshUI();
    checkKeep();
})();
</script>
</body>
</html>
