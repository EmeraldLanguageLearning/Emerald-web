<style>
:root{
  --emerald:#49B190; --emerald-link:#53AC90; --emerald-dark:#457865; --emerald-soft:#72B1A0;
  --text-strong:#323232; --text:#777777; --bg:#FFFFFF; --bg-soft:#F9F9F9; --line:#DADADA; --line-strong:#BBBBBB;
  --font-head:"Montserrat","Segoe UI",system-ui,sans-serif; --font-body:"Open Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.8}
.wrap{max-width:1080px;width:80%;margin:0 auto}
@media (max-width:720px){.wrap{width:auto;padding-left:18px;padding-right:18px}}
.site{background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.site-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.brand-logo{height:60px;width:auto;display:block}
@media (max-width:520px){.brand-logo{height:44px}.site-in{padding-block:12px}}
.lang{display:inline-flex;border:1px solid var(--emerald);border-radius:4px;overflow:hidden;flex:none}
.lang button{font:600 .85rem var(--font-body);letter-spacing:.04em;border:0;background:#fff;color:var(--emerald-dark);padding:7px 13px;cursor:pointer}
.lang button+button{border-left:1px solid var(--emerald)}
.lang button[aria-pressed="true"]{background:var(--emerald);color:#fff}
.hero{text-align:center;padding:44px 0 8px}
.hero img{width:96px;height:auto;display:block;margin:0 auto 18px}
h1{font-family:var(--font-head);font-weight:300;text-transform:uppercase;color:var(--emerald-dark);font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.2;margin:0 0 10px;letter-spacing:.02em}
.hero p{margin:0 auto;max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:64px 28px;padding:76px 0 64px}
.card{position:relative;background:var(--bg-soft);border-radius:4px;padding:66px 22px 26px;text-align:center;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(69,120,101,.12);outline:none}
.card .circle{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;background:var(--emerald);display:grid;place-items:center}
.card .circle svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card h2{font-family:var(--font-head);font-weight:700;color:var(--text-strong);font-size:1.1rem;margin:0}
.card p{margin:0;font-size:.95rem}
.card .go{margin-top:8px;font-weight:600;color:var(--emerald-dark);font-size:.9rem}
.card.soon{opacity:.6;pointer-events:none}
  .install{display:none;max-width:560px;margin:22px auto 0;background:var(--bg-soft);border-left:3px solid var(--emerald);border-radius:4px;padding:12px 16px;text-align:left;font-size:.92rem}
  .install b{color:var(--text-strong)}
  .install a{color:var(--emerald-dark);font-weight:600}
  .install svg{width:16px;height:16px;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:2}
.sec{text-align:center;padding:24px 0 0;border-top:1px solid var(--line)}
.sec h2{font-family:var(--font-head);font-weight:400;text-transform:uppercase;color:var(--emerald-dark);font-size:clamp(1.3rem,4vw,1.9rem);letter-spacing:.03em;line-height:1.3;margin:24px 0 8px}
.sec p{margin:0 auto;max-width:56ch}
footer{border-top:1px solid var(--line);text-align:center;font-size:.8rem;color:var(--line-strong);padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
<style id="emerald-dark">
/* Dark version of the Emerald look, used when the phone is in dark mode */
@media screen and (prefers-color-scheme: dark){
  :root{color-scheme:dark;--emerald-dark:#7fcbb0;--emerald-link:#6cc8a6;--text-strong:#edf2f0;--text:#b6c2bd;--bg:#121816;--bg-soft:#1a2320;--line:#2f3b37;--line-strong:#4b5a55}
  .card:hover,.card:focus-visible{box-shadow:0 6px 18px rgba(0,0,0,.45)}

  .site{background:#161e1b!important;border-bottom-color:#2f3b37!important}
  .brand-logo{background:#fff;border-radius:6px;padding:4px 8px;box-sizing:content-box}
  .lang button{background:transparent!important;color:#7fcbb0!important}
  .lang button[aria-pressed="true"]{background:#49B190!important;color:#fff!important}
  .app-home{background:transparent!important;color:#7fcbb0!important}
  .app-home:hover{background:#1d3a31!important}
}
</style>

</head>
