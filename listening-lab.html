<!doctype html>
<html lang="en">
<head><script src="legacy.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Emerald"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#49B190"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Listening Lab (Emerald)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="app-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Emerald Language Learning palette */
:root{
  --emerald:#49B190; --emerald-link:#53AC90; --emerald-dark:#457865; --emerald-soft:#72B1A0; --emerald-hover:#3f9c7e;
  --bg:#F9F9F9; --sheet:#ffffff; --ink:#323232; --muted:#777777; --faint:#a3a3a3; --line:#DADADA; --line-strong:#BBBBBB;
  --accent:#49B190; --accent-soft:#e9f6f1; --mark:#fde8a6; --mark-ink:#3b3000;
  --ok:#2f8f6a; --ok-soft:#e7f5ef; --bad:#c8443a; --bad-soft:#fcecea;
  --screen:#1f3a31; --screen-hi:#457865; --screen-ink:#ffffff;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --body:"Open Sans","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sheet);color:var(--muted);font-family:var(--body);font-size:16px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1080px;width:80%;margin:0 auto}
@media (max-width:720px){.wrap{width:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:400;text-transform:uppercase;color:var(--emerald-dark);letter-spacing:.01em}
h2{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:400;text-transform:uppercase;color:var(--emerald-dark)}
h3{font-size:1.02rem;font-weight:700;color:var(--ink)}
p{margin:0}
b,strong{color:var(--ink)}
.label{font-family:var(--body);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--emerald-soft)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* site header */
.site{background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.site-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.brand-logo{height:60px;width:auto;display:block}
.brand-home{display:block;line-height:0;border-radius:6px;cursor:pointer;transition:opacity .15s}.brand-home:hover{opacity:.85}.brand-home:focus-visible{outline:3px solid #49B190;outline-offset:3px}
@media (max-width:520px){.brand-logo{height:44px}.site-in{padding-block:12px}}
.lang{display:inline-flex;border:1px solid var(--emerald);border-radius:4px;overflow:hidden;flex:none}
.lang button{font:600 .85rem var(--body);letter-spacing:.04em;border:0;background:#fff;color:var(--emerald-dark);padding:7px 13px;cursor:pointer}
.lang button+button{border-left:1px solid var(--emerald)}
.lang button:hover{background:var(--accent-soft)}
.lang button[aria-pressed="true"]{background:var(--emerald);color:#fff}
.lang button:focus-visible{outline:2px solid var(--emerald-dark);outline-offset:2px}

/* title + step rail (sticky) */
.bar{background:#fff;border-bottom:1px solid var(--line);position:-webkit-sticky;position:sticky;top:0;z-index:5}
.bar .wrap{padding-top:22px;display:flex;flex-direction:column;gap:14px}
.toprow{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.clipmeta{font-family:var(--mono);font-size:.8rem;color:var(--faint)}
.rail{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.rail::-webkit-scrollbar{display:none}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 2px 10px;font-family:var(--body);font-weight:600;font-size:.95rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.rail button:hover{color:var(--emerald-link)}
.rail button .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:.75rem}
.rail button.done .n{background:var(--emerald);border-color:var(--emerald);color:#fff}
.rail button[aria-current="step"]{color:var(--emerald-link);border-bottom-color:var(--emerald)}
.rail button.locked{opacity:.55}
.rail button:focus-visible{outline:2px solid var(--emerald);outline-offset:-2px}

main .wrap{padding-block:36px 72px;display:flex;flex-direction:column;gap:20px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:32px;display:flex;flex-direction:column;gap:22px}
@media (max-width:520px){.sheet{padding:20px}}
.intro{display:flex;flex-direction:column;gap:8px}
.intro p{max-width:66ch}

/* listen bar */
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:4px;background:var(--bg);border-left:3px solid var(--emerald)}
.listen .info{flex:1 1 220px;min-width:0;font-size:.92rem}
.count{font-family:var(--mono);font-size:.85rem;color:var(--emerald-dark)}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:4px;font-family:var(--body);font-weight:600;font-size:.93rem;background:var(--emerald);color:#fff;text-decoration:none;transition:background-color .15s}
.btn:hover{background:var(--emerald-hover)}
.btn.ghost{background:#fff;color:var(--emerald-dark);box-shadow:inset 0 0 0 1px var(--emerald)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:transparent;color:var(--muted);padding:6px 8px}
.btn.quiet:hover{color:var(--emerald-link);background:transparent}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--emerald-dark);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* chips */
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-family:var(--body);font-size:.88rem;color:var(--muted)}
.chip:hover{border-color:var(--emerald);color:var(--emerald-dark)}
.chip[aria-pressed="true"]{background:var(--emerald);border-color:var(--emerald);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}

textarea,input[type=text],input[type=number],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--emerald);background:#fff}
label.field,.field{display:flex;flex-direction:column;gap:6px}

/* keywords */
.kw{display:flex;flex-direction:column;gap:10px}
.kwrow{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:4px;background:#fff;transition:background-color .2s,border-color .2s}
.kwrow .chips .chip{font-size:.8rem;padding:3px 10px}
@media (max-width:620px){.kwrow{grid-template-columns:minmax(0,1fr) auto}.kwrow .chips{grid-column:1/-1;grid-row:2}}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;font-size:.9rem}
.legend dt{font-family:var(--display);font-weight:700;color:var(--ink)}
.legend dd{margin:0;color:var(--muted)}
details summary{cursor:pointer;font-family:var(--body);font-weight:600;color:var(--emerald-link)}

/* transcript */
.script{font-size:1.08rem;line-height:2.3;max-width:68ch;color:var(--ink)}
.blank{font:inherit;font-family:var(--mono);font-size:.92rem;border:none;border-bottom:2px solid var(--emerald);background:var(--accent-soft);color:var(--ink);padding:0 6px;border-radius:4px 4px 0 0;text-align:center}
.blank:focus{outline:none;background:var(--mark);color:var(--mark-ink)}
.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-family:var(--mono);font-size:.82rem;color:var(--ok);margin-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{font-family:var(--mono);font-size:.88rem;padding:2px 10px;border:1px dashed var(--line-strong);border-radius:4px;color:var(--ink)}
.bank span.used{text-decoration:line-through;opacity:.45}
.bank span.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.progress{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:.85rem}
.progress .met{color:var(--ok)}

/* final */
.lock{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px dashed var(--line-strong);border-radius:4px;background:var(--bg)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--display);font-weight:700;font-size:2.4rem;color:var(--emerald-dark)}
.quote{padding:14px 16px;border-left:3px solid var(--emerald);background:var(--bg);border-radius:0 4px 4px 0;white-space:pre-wrap;color:var(--ink)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.summary div{display:flex;flex-direction:column;gap:4px;font-size:.92rem;min-width:0}

.note{font-size:.88rem;color:var(--muted)}
.linkbtn{all:unset;cursor:pointer;color:var(--emerald-link);text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
main a:not(.btn){color:var(--emerald-link)}
@media (pointer:coarse){
  .blank,.tool-select{font-size:16px}
  .tool{padding:8px 12px}
  .chip{padding:7px 14px}
  .kwrow .chips .chip{padding:6px 12px}
}
.fbrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kwcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.kwok{display:none;font-size:.8rem;font-weight:600;color:var(--ok)}
.kwrow.ok{border-color:var(--ok);background:var(--ok-soft)}
.kwrow.ok .kwok{display:block}
.kwrow.ok input[type=text]{border-color:var(--ok)}
.tlayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:24px;align-items:start}
.tmain{min-width:0}
.tside{display:flex;flex-direction:column;gap:18px;padding:16px;background:var(--bg);border-radius:4px;position:-webkit-sticky;position:sticky;top:150px}
@media (max-width:720px){.tlayout{grid-template-columns:1fr}.tside{position:static;order:-1}}
@media (prefers-reduced-motion:reduce){.kwrow{transition:none}}
.alt{font-size:.85rem;color:var(--emerald-link)}
.helper{border:1px dashed var(--line-strong);border-radius:4px;padding:12px 14px}
.howto{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.92rem;max-width:68ch}
.player{display:flex;flex-direction:column;gap:10px}
.screen{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:16/9;max-width:100%;border-radius:4px;text-decoration:none;color:var(--screen-ink);background:radial-gradient(120% 90% at 50% 40%,var(--screen-hi),var(--screen));padding:16px;text-align:center}
.screen:focus-visible{outline:3px solid var(--emerald);outline-offset:3px}
.pplay{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--emerald);color:#fff;transition:transform .15s}
.screen:hover .pplay{transform:scale(1.06)}
.ptitle{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1.1rem;text-wrap:balance;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.ptime{font-size:.82rem;opacity:.85}
.screen.embed{padding:0;overflow:hidden;background:var(--screen)}
.screen.embed iframe{width:100%;height:100%;border:0;display:block}
.player.small{max-width:640px}
.listen.audio .info{flex:1 1 100%}
.aplayer{display:flex;flex-direction:column;gap:8px;flex:1 1 280px;min-width:0}
.aplayer audio{width:100%;display:block}
.speeds{display:flex;gap:6px;flex-wrap:wrap}
.dframe{width:100%;aspect-ratio:5/1;min-height:240px;height:auto;border:0;border-radius:4px;background:#000;display:block}
.listen.audio.fallback .aplayer{flex:1 1 100%}
.listen.audio.fallback .count{margin-left:auto}
.pfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.pfoot .note{flex:1 1 260px;min-width:0}
@media (prefers-reduced-motion:reduce){.pplay{transition:none}}

/* playlist cards */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px;background:var(--bg);border:1px solid transparent;border-radius:4px}
.pitem.current{border-color:var(--emerald);box-shadow:inset 3px 0 0 var(--emerald)}
.pnum{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--emerald);color:#fff;font-family:var(--display);font-weight:700;font-size:1rem;align-self:start}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph3{display:flex;align-items:center;gap:10px}
.picon{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;color:var(--emerald)}
.picon svg{width:24px;height:24px;display:block}
.picon.emoji{font-size:1.3rem;line-height:1}
.pmeta{font-size:.8rem}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:240px}
.pbar span{display:block;height:100%;background:var(--emerald)}
.pdone{color:var(--ok)}
.pact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ptools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px}
.ptools .btn{font-size:.82rem;padding:4px 8px}
.pdel{color:var(--bad)!important}
@media (max-width:620px){.pitem{grid-template-columns:auto minmax(0,1fr)}.pact{grid-column:1/-1;align-items:stretch}.pact>.btn{justify-content:center}.ptools{justify-content:flex-start}}

/* editor */
.editor{display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;background:var(--bg)}
.editor textarea{border-radius:0 0 4px 4px}
.tool{all:unset;cursor:pointer;padding:5px 10px;border-radius:4px;font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--ink);white-space:nowrap}
.tool:hover{background:var(--accent-soft)}
.tool:focus-visible{outline:2px solid var(--emerald);outline-offset:1px}
.tool.key{background:var(--emerald);color:#fff}
.tool.key:hover{background:var(--emerald-hover)}
.tool-select{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer}
.tool-select:focus-visible{outline:2px solid var(--emerald);outline-offset:1px}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.preview{font-size:.98rem;line-height:2.1;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:4px;overflow-wrap:anywhere;color:var(--ink)}
.preview mark{background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--emerald);padding:0 5px;border-radius:3px 3px 0 0;font-family:var(--mono);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--emerald-dark);color:#fff;padding:10px 18px;border-radius:4px;font-family:var(--body);font-size:.9rem;z-index:20}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);color:var(--emerald-dark);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>
<style id="emerald-dark">
/* Dark version of the Emerald look, used when the phone is in dark mode */
@media screen and (prefers-color-scheme: dark){
  :root{color-scheme:dark;--emerald-dark:#7fcbb0;--emerald-link:#6cc8a6;--emerald-soft:#7fcbb0;
    --bg:#1a2320;--sheet:#121816;--ink:#edf2f0;--muted:#b6c2bd;--faint:#7d8a85;--line:#2f3b37;--line-strong:#4b5a55;
    --accent-soft:#1d3a31;--mark:#6b5a14;--mark-ink:#fff3c4;--ok:#5fd19b;--ok-soft:#173a2b;--bad:#f08a80;--bad-soft:#3a1d1a}
  .bar{background:#161e1b;border-bottom-color:#2f3b37}
  .btn.ghost{background:transparent;color:#7fcbb0}
  .btn.ghost:hover{background:#1d3a31}
  .chip{background:transparent}
  .chip[aria-pressed="true"]{background:#49B190;color:#fff}
  textarea:focus,input:focus{background:#1f2a26}
  .kwrow{background:#161e1b}
  .tool-select{background:#1f2a26;color:var(--ink)}
  .toast{background:#2c6b56;color:#fff}

  .site{background:#161e1b!important;border-bottom-color:#2f3b37!important}
  .brand-logo{background:#fff;border-radius:6px;padding:4px 8px;box-sizing:content-box}
  .lang button{background:transparent!important;color:#7fcbb0!important}
  .lang button[aria-pressed="true"]{background:#49B190!important;color:#fff!important}
  .app-home{background:transparent!important;color:#7fcbb0!important}
  .app-home:hover{background:#1d3a31!important}
}
</style>

</head>
<body>
