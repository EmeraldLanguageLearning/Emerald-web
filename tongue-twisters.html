<style>
/* Layout: one centred working column; builder card, result card, practice set. Emerald Language Learning tokens. */
:root {
  --emerald: #49B190;
  --emerald-hover: #3f9c7e;
  --emerald-link: #53AC90;
  --emerald-dark: #457865;
  --emerald-soft: #72B1A0;
  --emerald-tint: rgba(73,177,144,.16);
  --contrast: #C7772E;
  --contrast-tint: rgba(217,130,59,.16);
  --text-strong: #323232;
  --text: #777777;
  --bg: #FFFFFF;
  --bg-soft: #F9F9F9;
  --line: #DADADA;
  --line-strong: #BBBBBB;
  --font-head: 'Montserrat', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Open Sans', 'Segoe UI', Arial, sans-serif;
  --font-ipa: 'Noto Sans', 'Open Sans', 'Segoe UI', 'Lucida Sans Unicode', 'Arial Unicode MS', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--emerald); outline-offset: 2px; }

.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header (shared Emerald Tools header) */
.site { background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.site-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand-logo { height: 60px; width: auto; display: block; }
.brand-home { display: block; line-height: 0; border-radius: 6px; cursor: pointer; transition: opacity .15s; }
.brand-home:hover { opacity: .85; }
.brand-home:focus-visible { outline: 3px solid #49B190; outline-offset: 3px; }
.lang { display: inline-flex; border: 1px solid var(--emerald); border-radius: 4px; overflow: hidden; }
.lang button { border: 0; background: var(--bg); color: var(--emerald-dark); padding: 6px 12px; font-weight: 600; font-size: .85rem; cursor: pointer; letter-spacing: .04em; }
.lang button + button { border-left: 1px solid var(--emerald); }
.lang button[aria-pressed="true"] { background: var(--emerald); color: #fff; }

/* Intro */
.intro { text-align: center; padding-block: 48px 28px; }
h1 { font-family: var(--font-head); font-weight: 300; text-transform: uppercase; color: var(--emerald-dark); font-size: clamp(1.9rem, 5vw, 3.1rem); line-height: 1.25; letter-spacing: .03em; margin: 0 0 14px; text-wrap: balance; }
.lead { max-width: 640px; margin: 0 auto; font-size: 1.02rem; line-height: 1.9; }

h2 { font-family: var(--font-head); font-weight: 400; text-transform: uppercase; color: var(--emerald-dark); font-size: clamp(1.3rem, 3vw, 1.75rem); letter-spacing: .04em; margin: 0 0 18px; text-align: center; text-wrap: balance; }

.card { background: var(--bg-soft); border-radius: 4px; padding: 26px clamp(16px, 4vw, 34px); }
section + section { margin-top: 34px; }

/* Builder */
.field-label { display: block; font-family: var(--font-head); font-weight: 700; color: var(--text-strong); font-size: .95rem; margin-bottom: 8px; }
.input-row { display: flex; gap: 10px; flex-wrap: wrap; }
.input-row input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 1.15rem; font-family: var(--font-ipa); padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--text-strong); }
.input-row input:focus { border-color: var(--emerald); outline: none; box-shadow: 0 0 0 3px var(--emerald-tint); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--emerald); color: #fff; border: 1px solid var(--emerald); border-radius: 4px; padding: 10px 20px; font-weight: 600; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { background: var(--emerald-hover); border-color: var(--emerald-hover); }
.btn.ghost { background: var(--bg); color: var(--emerald-dark); }
.btn.ghost:hover { background: var(--emerald-tint); }
.btn.small { padding: 7px 13px; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 17px; height: 17px; flex: none; }

.quick { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.quick-label { font-size: .85rem; margin-right: 4px; }
.qchip { border: 1px solid var(--line-strong); background: var(--bg); color: var(--emerald-dark); border-radius: 4px; padding: 3px 11px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.qchip:hover { border-color: var(--emerald); color: var(--emerald-link); }

.sound-pick { margin-top: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: baseline; gap: 7px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text-strong); border-radius: 4px; padding: 7px 13px; cursor: pointer; }
.chip .ipa { font-family: var(--font-ipa); font-size: 1.05rem; font-weight: 600; color: var(--emerald-dark); }
.chip .ex { font-weight: 600; }
.chip .cnt { font-size: .78rem; color: var(--text); }
.chip.on { border-color: var(--emerald); background: var(--emerald); color: #fff; }
.chip.on .ipa, .chip.on .cnt { color: #fff; }
.chip:disabled { opacity: .45; cursor: default; }
.err { color: #A6492F; background: #FBEDE8; border-radius: 4px; padding: 10px 14px; margin: 0; }

.options { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px 24px; align-items: end; }
.opt-label { display: block; font-family: var(--font-head); font-weight: 700; color: var(--text-strong); font-size: .85rem; margin-bottom: 6px; }
select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--text-strong); font-family: var(--font-ipa); }
.check { display: flex; align-items: center; gap: 9px; cursor: pointer; color: var(--text-strong); padding-bottom: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--emerald); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; width: 100%; }
.seg button { flex: 1; border: 0; background: var(--bg); color: var(--text); padding: 8px 10px; cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-checked="true"] { background: var(--emerald); color: #fff; }

/* Result */
.result-head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; margin-bottom: 18px; }
.pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 12px; border-radius: 4px; font-weight: 600; font-size: .9rem; }
.pill .ipa { font-family: var(--font-ipa); }
.pill.tg { background: var(--emerald-tint); color: var(--emerald-dark); }
.pill.ct { background: var(--contrast-tint); color: #93531a; }
.stats { font-size: .85rem; }
.twister { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 22px clamp(14px, 3vw, 28px) 12px; }
.interlinear { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
.w { display: inline-flex; flex-direction: column; align-items: center; margin-bottom: 10px; min-width: 0; }
.wt { font-family: var(--font-head); font-weight: 600; font-size: clamp(1.15rem, 2.6vw, 1.5rem); color: var(--text-strong); line-height: 1.35; }
.wi { font-family: var(--font-ipa); font-size: .9rem; color: var(--text); line-height: 1.4; }
.brk { font-family: var(--font-ipa); color: var(--line-strong); align-self: flex-start; font-size: 1.3rem; padding-top: 2px; }
mark { background: transparent; color: inherit; }
mark.tg { color: var(--emerald-dark); background: var(--emerald-tint); border-radius: 2px; box-shadow: inset 0 -2px 0 var(--emerald); }
mark.ct { color: #93531a; background: var(--contrast-tint); border-radius: 2px; box-shadow: inset 0 -2px 0 var(--contrast); }
.wt mark.tg, .wt mark.ct { font-weight: 700; }
.ipa-line { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
.ipa-label { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--emerald-soft); font-weight: 600; margin-bottom: 4px; }
.ipa-full { font-family: var(--font-ipa); font-size: 1.12rem; color: var(--text-strong); line-height: 1.8; overflow-wrap: anywhere; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; font-size: .8rem; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.legend .l-tg i { background: var(--emerald-tint); box-shadow: inset 0 -2px 0 var(--emerald); }
.legend .l-ct i { background: var(--contrast-tint); box-shadow: inset 0 -2px 0 var(--contrast); }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
.listen { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.listen-label { font-weight: 600; color: var(--text-strong); font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.listen-label svg { width: 18px; height: 18px; color: var(--emerald); }
.divider { width: 1px; background: var(--line); align-self: stretch; }

/* Tip card (feature card with overlapping circle) */
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 46px 24px; margin-top: 52px; }
.tip { position: relative; background: var(--bg); border-radius: 4px; padding: 52px 22px 20px; text-align: center; border: 1px solid var(--line); }
.tip-icon { position: absolute; top: -36px; left: 50%; transform: translateX(-50%); width: 72px; height: 72px; border-radius: 50%; background: var(--emerald); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-ipa); font-size: 1.45rem; font-weight: 600; }
.tip.ctip .tip-icon { background: var(--contrast); }
.tip h3 { font-family: var(--font-head); font-weight: 700; color: var(--text-strong); font-size: 1rem; margin: 0 0 6px; }
.tip p { margin: 0; line-height: 1.9; }

/* Practice set */
.set-empty { text-align: center; max-width: 560px; margin: 0 auto; line-height: 1.9; }
.set-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.set-item { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.set-num { font-family: var(--font-head); font-weight: 700; color: var(--emerald); font-size: 1.1rem; }
.set-body { min-width: 0; }
.set-tw { color: var(--text-strong); font-weight: 600; line-height: 1.6; }
.set-ipa { font-family: var(--font-ipa); font-size: .9rem; overflow-wrap: anywhere; }
.set-tags { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.set-tags .pill { font-size: .75rem; padding: 1px 8px; }
.icon-btn { border: 1px solid transparent; background: transparent; color: var(--text); border-radius: 4px; padding: 4px 6px; cursor: pointer; display: inline-flex; }
.icon-btn:hover { color: #A6492F; border-color: var(--line); }
.icon-btn svg { width: 18px; height: 18px; }
.set-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
.hint { font-size: .82rem; text-align: center; margin: 12px auto 0; max-width: 640px; line-height: 1.7; }
.hint b { color: var(--text-strong); }
.copy-box { width: 100%; height: 90px; margin-top: 12px; font-family: Consolas, monospace; font-size: .75rem; border: 1px solid var(--line-strong); border-radius: 4px; padding: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text-strong); color: #fff; padding: 9px 18px; border-radius: 4px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }

.site-footer { border-top: 1px solid var(--line); margin-top: 56px; padding-block: 22px; font-size: .8rem; text-align: center; }

@media (max-width: 640px) {
  .brand-logo { height: 46px; }
  .intro { padding-block: 32px 20px; }
  .divider { display: none; }
  .set-item { grid-template-columns: 26px 1fr auto; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* Print sheet */
#printSheet { display: none; }
@media print {
  @page { margin: 14mm 14mm 16mm; }
  .screen, .toast { display: none !important; }
  #printSheet { display: block; color: #323232; font-family: var(--font-body); font-size: 11pt; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ps-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #DADADA; padding-bottom: 10px; margin-bottom: 18px; }
  .ps-head img { height: 44px; width: auto; }
  .ps-title { font-family: var(--font-head); font-weight: 400; text-transform: uppercase; color: #457865; font-size: 15pt; letter-spacing: .04em; text-align: right; }
  .ps-date { font-size: 9pt; color: #777; text-align: right; }
  .ps-item { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 0 14px; border-bottom: 1px solid #eee; break-inside: avoid; }
  .ps-num { font-family: var(--font-head); font-weight: 700; color: #49B190; font-size: 14pt; }
  .ps-tag { font-size: 9pt; color: #457865; font-weight: 600; }
  .ps-tag .ipa { font-family: var(--font-ipa); }
  .ps-tw { font-family: var(--font-head); font-weight: 600; font-size: 14pt; margin: 2px 0 4px; line-height: 1.45; }
  .ps-ipa { font-family: var(--font-ipa); font-size: 11pt; margin: 0 0 6px; }
  .ps-tip { font-size: 9.5pt; color: #555; margin: 0 0 6px; }
  .ps-check { font-size: 9pt; color: #777; display: flex; gap: 16px; flex-wrap: wrap; }
  .ps-check span::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 1px solid #999; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .ps-foot { margin-top: 14px; font-size: 8.5pt; color: #999; text-align: center; }
  mark.tg { background: rgba(73,177,144,.18); box-shadow: none; text-decoration: underline; text-decoration-color: #49B190; text-decoration-thickness: 2px; text-underline-offset: 2px; color: #2f6b56; font-weight: 700; }
  mark.ct { background: rgba(217,130,59,.18); box-shadow: none; text-decoration: underline dotted; text-decoration-color: #C7772E; text-decoration-thickness: 2px; text-underline-offset: 2px; color: #93531a; font-weight: 700; }
}
</style>
<style id="emerald-dark">
/* Dark version of the Emerald look, used when the phone is in dark mode */
@media screen and (prefers-color-scheme: dark){
  :root{color-scheme:dark;--emerald-dark:#7fcbb0;--emerald-link:#6cc8a6;--emerald-tint:rgba(73,177,144,.24);--contrast-tint:rgba(217,130,59,.24);
    --text-strong:#edf2f0;--text:#b6c2bd;--bg:#121816;--bg-soft:#1a2320;--line:#2f3b37;--line-strong:#4b5a55}
  input,select,.copy-box{background:#1f2a26!important;color:#edf2f0}
  .twister,.tip,.set-item,.chip,.qchip,.seg button,.btn.ghost{background:#161e1b}
  .chip.on,.seg button[aria-checked="true"]{background:#49B190;color:#fff}
  .btn.ghost:hover{background:#1d3a31}
  .pill.ct,mark.ct{color:#f2b27a}
  .err{background:#3a2420;color:#f4a58f}
  .icon-btn:hover{color:#f4a58f}
  .toast{background:#2f3b37}

  .site{background:#161e1b!important;border-bottom-color:#2f3b37!important}
  .brand-logo{background:#fff;border-radius:6px;padding:4px 8px;box-sizing:content-box}
  .lang button{background:transparent!important;color:#7fcbb0!important}
  .lang button[aria-pressed="true"]{background:#49B190!important;color:#fff!important}
  .app-home{background:transparent!important;color:#7fcbb0!important}
  .app-home:hover{background:#1d3a31!important}
}
</style>
</head>

  <section class="card builder" aria-labelledby="soundLabel">
    <label class="field-label" id="soundLabel" for="soundInput" data-i18n="inputLabel">Son ou graphie à travailler</label>
    <form class="input-row" id="soundForm" autocomplete="off">
      <input id="soundInput" type="text" value="th" spellcheck="false" data-i18n-ph="placeholder">

    </div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <h2 data-i18n="resultTitle">Votre virelangue</h2>
    <div class="result-head" id="resultHead"></div>
    <div class="twister">
      <div class="interlinear" id="interlinear"></div>
      <div class="ipa-line">
        <span class="ipa-label" data-i18n="ipaLabel"></span>
        <div class="ipa-full" id="ipaFull"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="actions">
      <div class="listen">
        <span class="listen-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span data-i18n="listen">Écouter</span></span>
        <button type="button" class="btn ghost small" data-rate="0.6" data-i18n="slow">Lent</button>
        <button type="button" class="btn ghost small" data-rate="0.9" data-i18n="normal">Normal</button>
        <button type="button" class="btn ghost small" data-rate="1.2" data-i18n="fast">Rapide</button>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" class="btn ghost" id="againBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-i18n="another">Un autre</span></button>
      <button type="button" class="btn" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="addLabel"></span></button>
    </div>
    <div class="tips" id="tips"></div>
  </section>

  <section class="card practice" id="practice">
    <h2 id="setTitle"></h2>
    <div id="setBody"></div>
    <div class="set-actions">
      <button type="button" class="btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg><span data-i18n="print">Imprimer / PDF</span></button>
      <button type="button" class="btn" id="ankiBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="16" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v14"/><path d="M7 10h6M7 14h4"/></svg><span data-i18n="anki">Exporter vers Anki</span></button>
      <button type="button" class="btn ghost" id="copyBtn"><span data-i18n="copyAnki">Copier pour Anki</span></button>
      <button type="button" class="btn ghost" id="clearBtn"><span id="clearLabel"></span></button>
    </div>
    <p class="hint" id="setHint"></p>
    <p class="hint" data-i18n-html="printHint"></p>
    <p class="hint" data-i18n-html="ankiHelp"></p>
    <textarea class="copy-box" id="copyBox" readonly hidden aria-label="Anki"></textarea>
  </section>
